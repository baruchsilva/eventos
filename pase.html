<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agregar al calendario · Assemble</title>
<meta name="robots" content="index">

<!-- Preview de WhatsApp / redes. Es estático: mismo para todos los eventos.
     Para preview por evento, duplicá este archivo y editá estas 3 líneas. -->
<meta property="og:title" content="Agregá el evento a tu calendario">
<meta property="og:description" content="Evento · Un tap y queda en tu agenda">
<meta property="og:image" content="https://TU-DOMINIO/assets/og-pase.jpg">
<meta property="og:type" content="website">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/pase.css">
<style>
  body{display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px}
  .contenedor{max-width:420px;width:100%}
  .marca{text-align:center;margin-bottom:16px;font-size:11px;letter-spacing:.16em;
    text-transform:uppercase;font-weight:700;color:var(--muted)}
  .aviso{background:#fff;border:1px solid var(--line);border-radius:var(--r-l);padding:24px;text-align:center}
  .aviso h1{font-size:18px;margin-bottom:8px;color:var(--navy)}
  .aviso p{margin:0;color:var(--muted);font-size:14px}
  .pie{text-align:center;margin-top:16px;font-size:12px;color:var(--muted)}
  .cargando{opacity:.5}
</style>
</head>
<body>

<div class="contenedor">
  <p class="marca">Los Elegidos OG</p>
  <div id="app" class="cargando">
    <div class="aviso"><h1>Cargando el pase…</h1><p>Un momento.</p></div>
  </div>
  <p class="pie" id="pie"></p>
</div>

<script src="assets/calendario.js"></script>
<script>
const app = document.getElementById('app');
const slug = (new URLSearchParams(location.search).get('e') || '').replace(/[^a-z0-9-_]/gi, '');

function aviso(titulo, texto){
  app.classList.remove('cargando');
  app.innerHTML = '<div class="aviso"><h1>' + titulo + '</h1><p>' + texto + '</p></div>';
}

function pinta(ev){
  const e = CAL.normaliza(ev), l = CAL.links(e);
  document.title = e.titulo + ' · Agregar al calendario';

  const boton = (href, texto, primario, descarga) =>
    '<a class="b' + (primario ? ' p' : '') + '" href="' + href + '"' +
    (descarga ? ' download="' + CAL.nombreArchivo(e) + '"' : ' target="_blank" rel="noopener"') +
    '>' + texto + '<span class="a">' + (descarga ? '↓' : '↗') + '</span></a>';

  app.classList.remove('cargando');
  app.innerHTML =
    '<div class="pase">' +
      '<div class="pase-body">' +
        '<p class="k">Agendalo</p>' +
        '<h1>' + e.titulo + '</h1>' +
        '<div class="meta">' +
          '<div><p class="k">Cuándo</p><p>' + CAL.fechaLarga(e) + '</p><p>' + CAL.horas(e) + '</p></div>' +
          '<div><p class="k">Dónde</p><p>' + (e.sede || '—') + '</p></div>' +
        '</div>' +
      '</div>' +
      '<div class="perf"></div>' +
      '<div class="pase-foot">' +
        boton(CAL.icsDataURI(e), 'Apple / Outlook escritorio', true, true) +
        boton(l.google, 'Google Calendar') +
        boton(l.office, 'Microsoft 365') +
        boton(l.outlook, 'Outlook.com') +
      '</div>' +
    '</div>';

  document.getElementById('pie').textContent =
    e.descripcion ? e.descripcion : 'Elige tu app de calendario.';
}

if (!slug){
  aviso('Falta el evento', 'El enlace debe incluir el identificador: pase.html?e=nombre-del-evento');
} else {
  fetch('eventos/' + slug + '.json', {cache: 'no-cache'})
    .then(r => { if (!r.ok) throw new Error(r.status); return r.json(); })
    .then(pinta)
    .catch(() => aviso('Evento no disponible',
      'No encontramos este pase. Verificá el enlace o escribinos a eventos@btcamericas.com.'));
}
</script>
</body>
</html>
